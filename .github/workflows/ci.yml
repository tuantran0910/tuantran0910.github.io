name: Validate Docs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lesson content and YAML
        run: |
          python -m pip install -r requirements-docs.txt
          python scripts/check_lessons.py
          python scripts/check_links.py
          python scripts/verify_yaml.py
          python scripts/check_handbook_quality.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
